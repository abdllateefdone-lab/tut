<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد اللطيف ياسر - الصفحة الشخصية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 1px solid #2d2d2d;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            background-color: #ff6b00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            margin: 0 auto 20px;
            color: #fff;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffffff;
        }

        p.title {
            color: #a0a0a0;
            font-size: 16px;
            margin-bottom: 25px;
        }

        .contact-info {
            background-color: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .contact-info span {
            display: block;
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 5px;
        }

        .contact-info a {
            color: #ff6b00;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            direction: ltr;
            display: inline-block;
        }

        .contact-info a:hover {
            text-decoration: underline;
        }

        .btn-whatsapp {
            display: inline-block;
            background-color: #25D366;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s;
            width: 100%;
        }

        .btn-whatsapp:hover {
            background-color: #20ba5a;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- دائرة افتراضية للحرف الأول من الاسم -->
        <div class="profile-img">ع</div>
        
        <!-- الاسم الخاص بك -->
        <h1>عبد اللطيف ياسر</h1>
        <p class="title">مطور ويب / مهندس</p>
        
        <div class="contact-info">
            <span>رقم الهاتف للاتصال</span>
            <a href="tel:+201550463800">+20 1550463800</a>
        </div>

        <!-- زر سريع لفتح محادثة واتساب مباشرة -->
        <a href="https://wa.me/201550463800" target="_blank" class="btn-whatsapp">
            تواصل معي عبر واتساب
        </a>
    </div>

</body>
</html>
